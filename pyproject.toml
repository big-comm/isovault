[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Emitted by PyGObject's own GLib overrides on import, not by ISOVault
    "ignore:GLib.unix_signal_add_full is deprecated:DeprecationWarning",
    "ignore::DeprecationWarning:gi.events",
]

[tool.ruff]
line-length = 120
src = ["usr/share/isovault", "tests"]
